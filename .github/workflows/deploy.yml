name: Deploy Eleventy site to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    types: [source-updated]
  schedule:
    # Every Monday at 08:17 Asia/Shanghai (00:17 UTC).
    - cron: "17 0 * * 1"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout site
        uses: actions/checkout@v4

      - name: Checkout guide source
        uses: actions/checkout@v4
        with:
          repository: wlabbyflower/peppapigconfigurationguide
          ref: main
          path: _content/peppapigconfigurationguide
          lfs: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Configure Pages path
        shell: bash
        run: |
          repository_name="${GITHUB_REPOSITORY#*/}"
          if [[ "$repository_name" == *.github.io ]]; then
            echo "PATH_PREFIX=/" >> "$GITHUB_ENV"
          else
            echo "PATH_PREFIX=/$repository_name/" >> "$GITHUB_ENV"
          fi
          echo "GUIDE_SOURCE_DIR=$GITHUB_WORKSPACE/_content/peppapigconfigurationguide" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci

      - name: Restore generated translations
        uses: actions/cache@v4
        with:
          path: src/_generated/i18n
          key: i18n-${{ vars.OPENAI_BASE_URL }}-${{ vars.OPENAI_TRANSLATION_MODEL }}-${{ vars.OPENAI_TRANSLATION_API_STYLE }}-${{ hashFiles('_content/peppapigconfigurationguide/docs/**/*.md', 'scripts/translate-guides.mjs') }}
          restore-keys: |
            i18n-

      - name: Translate guide content
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL }}
          OPENAI_TRANSLATION_MODEL: ${{ vars.OPENAI_TRANSLATION_MODEL || 'gpt-4o-mini' }}
          OPENAI_TRANSLATION_API_STYLE: ${{ vars.OPENAI_TRANSLATION_API_STYLE || 'chat' }}
        run: npm run translate:i18n

      - name: Build
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
